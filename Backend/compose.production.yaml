# Produktions-Stack für cms.<domain>. Nur der Reverse Proxy ist nach außen
# exponiert; API, Admin, MongoDB und MinIO liegen im internen Netz.
# Start: docker compose -f compose.production.yaml --env-file infrastructure/.env.production up -d

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CMS_DOMAIN: ${CMS_DOMAIN}
    depends_on:
      - api
      - admin
    networks: [edge, internal]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: cms-api:latest
    restart: unless-stopped
    env_file: [infrastructure/.env.production]
    environment:
      NODE_ENV: production
      PORT: "4000"
    depends_on:
      mongo: { condition: service_healthy }
      minio: { condition: service_started }
    networks: [internal]

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
    image: cms-admin:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Serverseitige Aufrufe des Admin an die API laufen intern.
      CMS_API_URL: http://api:4000
    depends_on:
      - api
    networks: [internal]

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks: [internal]

  # Tägliches, verschlüsseltes MongoDB-Backup in ein Volume.
  backup:
    image: mongo:7
    restart: unless-stopped
    env_file: [infrastructure/.env.production]
    volumes:
      - ./infrastructure/scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/backup.sh; sleep 86400; done"]
    depends_on:
      mongo: { condition: service_healthy }
    networks: [internal]

volumes:
  mongo-data:
  minio-data:
  caddy-data:
  caddy-config:
  backups:

networks:
  edge:
  internal:
